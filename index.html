<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Магазин</title>
  </head>

  <body>
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-lg-5">
          <div class="goods-box" id="goods">
            <div class="menu">
              <input type="text" placeholder="Поиск" class="search" name="search-field" />
              <button
                class="add btn btn-success"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                &#10010;
              </button>
            </div>
            <div class="table-responsive">
              <table class="goods table mt-3" id="table1">
                <thead class="table-primary align-middle">
                  <th data-type="number">№</th>
                  <th data-type="string">Название</th>
                  <th data-type="number">Цена, &#8381;</th>
                  <th data-type="number">Количество</th>
                  <th></th>
                  <th></th>
                </thead>
                <tbody class="list"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-xs-12 col-lg-7">
          <div class="price-box">
            <div class="menu">
              <div class="price-title">
                Итого: <span class="total-cost">0 &#8381;</span>
              </div>
            </div>
            <div class="table-responsive">
              <table class="price table mt-3" id="table2">
                <thead class="table-primary align-middle">
                  <tr>
                    <th data-type="number">№</th>
                    <th data-type="string">Название</th>
                    <th data-type="number">Цена, &#8381;</th>
                    <th data-type="number">Количество</th>
                    <th>Скидка, %</th>
                    <th data-type="number">Стоимость, &#8381;</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody class="cart"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить товар</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <label for="good-name" class="form-label">Название товара</label>
            <input
              type="text"
              class="form-control mb-3"
              id="good-name"
              maxlength="40"
            />
            <label for="good-price" class="form-label">Цена</label>
            <div class="input-group">
              <input
                type="number"
                class="form-control mb-3"
                id="good-price"
                min="0"
                max="999999"
                value="0"
              />
              <span class="input-group-text" id="good-price-addon">&#8381;</span>
            </div>
            <label for="good-count" class="form-label">Количество</label>
            <input
              type="number"
              class="form-control mb-3"
              id="good-count"
              min="1"
              max="999"
              value="1"
            />
            <button type="submit" class="add-new btn btn-success">
              Сохранить
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/list.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
